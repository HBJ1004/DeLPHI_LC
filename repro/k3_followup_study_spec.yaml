schema: delphi.k3-followup-study-spec.v1
spec_version: 1.0.0
status: frozen_before_ztf_prediction_and_convergence_execution
frozen_date: "2026-09-10"
title: Cross-survey transport and convergence-stopped inversion follow-up

scope:
  model: frozen_delphi_k3_v1.0_weights
  period: externally_supplied_fixed_period
  candidate_semantics: unordered_three_axis_set
  reference_access: forbidden_until_predictions_or_fit_selection_are_saved
  allowed_outcomes: [positive, negative, inconclusive]

ztf_cross_survey:
  role: retrospective_cross_survey_cross_fitted_transport
  identities: existing_damit_20250610_objects_with_ztf_photometry
  model_policy: average_the_five_seed_score_grids_from_the_identity_held_out_fold
  photometry:
    filter: ztf_r
    maximum_sigma_magnitude: 0.2
    epoch_policy: one_source_epoch_per_ztf_object
    primary_brightness: object_relative_flux_from_observed_magnitude
  geometry:
    source: frozen_jpl_horizons_vector_queries
    frame: asteroid_centric_ecliptic_j2000
    observer: earth_center_approximation_for_ztf_horizons_geometry
    vectors: [asteroid_to_sun, asteroid_to_earth]
    validation: [dhelio_norm, dobs_norm, phase_angle, optional_radec_projection]
  reporting:
    unit: asteroid
    metrics: [oracle_at_3_mean, oracle_at_3_median, fraction_within_20_deg, fraction_within_30_deg, prediction_failures]
    interval: object_bootstrap_95_percent
    forbidden_terms: [prospective_validation, unseen_identity_validation, deployment_accuracy]

temporal_external_case_series:
  cutoff_utc: "2025-06-10T00:03:01Z"
  identities: [asteroid_49, asteroid_279, asteroid_366]
  period: deterministically_selected_from_damit_model_records_and_externally_supplied_fixed_before_prediction
  model_policy: average_all_25_real_fold_seed_score_grids
  reporting: all_objects_individually_without_population_interval_or_gate
  permitted_description: post_cutoff_damit_record_case_series

convergence_acceleration:
  role: preregistered_followup_with_internally_locked_evaluation
  full_cohort: frozen_170_object_damit_oof_cohort
  frozen_inputs:
    publication_split_sha256: 1c5b15b6577805326a0c36605c174277a1d6653a60c2ac26b717373fe8d61df4
    reference_catalog_sha256: ac1abdab62453fca6e3d7473af0ad3b7de1bcb04cee9b947fb7079d340613679
    oof_ensemble_sha256: 54d2f1ebb0f0e8993dc61d0e2a090a19eb1fefcbd170f7a9741ad8fbf9acbc05
    blind_execution_inputs_sha256: 10f310f9ba735ccdf154105ad8d11a3c698f44046f5c33a55f256a846157ba1f
    official_solver_archive_sha256: b1bc2402732e8fd4d1bfe56973a3693bf7ceb6f3bb31e8b5f03926fac59c410c
    neural_timing_schema: delphi.k3-convergence-neural-timing.v1
    solver_binary_source_tree_compiler_and_timing: frozen_in_pre_execution_study_lock
  split:
    method: six_development_objects_per_original_outer_fold_by_sha256_rank
    salt: delphi-k3-convergence-followup-20260910
    development_count: 30
    locked_evaluation_count: 140
  arms:
    baseline: six_damit_standard_signed_starts
    guided: three_frozen_oof_k3_axes_expanded_to_six_signed_starts
  shared_conditions:
    solver: damit_convexinv_0.2.1
    period: first_frozen_catalog_solution_fixed_in_both_arms
    convergence_tolerance_grid: [0.01, 0.003, 0.001, 0.0003, 0.0001]
    iteration_cap: 1000
    timeout_seconds_per_start: 300
    timing_repeats: 3
    repeat_order_seed: 20260910
    bootstrap_resamples: 10000
    bootstrap_seed: 20260911
    include_warm_neural_inference_time: true
    report_cold_neural_inference_sensitivity: true
    compiler_version_command: [cc, --version]
  development_selection:
    eligible_tolerance_requires:
      guided_minus_baseline_recovery_point_difference_minimum: -0.05
      guided_minus_baseline_completion_point_difference_minimum: -0.05
      guided_to_baseline_geometric_mean_rms_ratio_maximum: 1.01
    choose: largest_runtime_ratio_lower_bound
    tie_break: smaller_convergence_tolerance
    no_eligible_tolerance: stop_without_locked_acceleration_test
  locked_evaluation_gate:
    runtime_ratio_stratified_bootstrap_acceptance_lower_strictly_greater_than: 1.0
    recovery_simultaneous_exact_lower_minimum: -0.05
    completion_simultaneous_exact_lower_minimum: -0.05
    rms_ratio_stratified_bootstrap_acceptance_upper_strictly_less_than: 1.01
    decision: all_four_conditions_must_pass
  analysis:
    inference_unit: asteroid
    timing_resampling: object_clustered_stratified_by_original_outer_fold
    timing_bounds: prespecified_empirical_acceptance_bounds_not_confidence_intervals
    fit_selection: minimum_final_relative_rms_without_reference_axis_access
    recovery: selected_fit_within_20_axial_degrees_of_any_frozen_catalog_axis
    binary_repeat_aggregation: object_success_requires_at_least_two_of_three_repeats
    binary_noninferiority_interval: simultaneous_conservative_exact_clopper_pearson
    failures: retained_in_completion_and_recovery_denominators
    rms_population: jointly_completed_and_selectable_pairs_without_reference_conditioning
    rms_minimum_joint_repeats_per_object: 2
    rms_required_object_support: {development: 30, locked_evaluation: 140}
    execution_cells: all_six_starts_both_arms_all_three_repeats_recorded
    phase_separation: blind_execution_and_fit_selection_then_hash_bound_reference_scoring
  maximum_positive_claim: >-
    K3-guided initialization accelerated this convex-inversion solver under
    known-period, six-start, convergence-stopped conditions on a retrospective
    DAMIT out-of-fold benchmark without exceeding the prespecified recovery,
    RMS, or completion noninferiority margins.

disclosures:
  - The fixed-work benchmark and its negative timing result were known before this follow-up.
  - Development tolerance selection is isolated from the locked evaluation subset.
  - The binary noninferiority margin is five percentage points because the original two-point margin was infeasible for a conservative exact 140-object paired analysis.
  - Bootstrap bounds are prespecified empirical acceptance bounds and are not labelled confidence intervals.
  - The post-cutoff DAMIT-record cohort has only three objects and is descriptive.
  - Cross-survey ZTF objects are not new identities and may have influenced pipeline development.
