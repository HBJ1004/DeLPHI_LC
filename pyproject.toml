[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "delphi-lc"
dynamic = ["version"]
description = "DeLPHI: three pole-axis candidates from asteroid lightcurves and observing geometry"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "DeLPHI contributors" },
]
keywords = ["asteroids", "astronomy", "lightcurves", "spin-pole inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy>=6.0,<8",
  "astropy-healpix>=1.0,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "safetensors>=0.4.3,<1",
  "scipy>=1.11,<2",
  "torch>=2.2,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
plot = [
  "matplotlib>=3.8,<4",
]
test = [
  "coverage[toml]>=7.5,<8",
  "matplotlib>=3.8,<4",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
]
package = [
  "build>=1.2,<2",
  "twine>=5,<7",
]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.5,<8",
  "matplotlib>=3.8,<4",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "twine>=5,<7",
]

[project.urls]
Repository = "https://github.com/HBJ1004/DeLPHI_LC"
Issues = "https://github.com/HBJ1004/DeLPHI_LC/issues"

[project.scripts]
delphi-k3 = "lc_pipeline.k3.cli:main"
delphi-k3-predict = "lc_pipeline.k3.predict:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "lc_pipeline.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["lc_pipeline*", "repro*"]
exclude = ["tests*", "repro.tests*", "experiments*", "artifacts*", "results*"]
namespaces = false

[tool.setuptools.package-data]
"repro" = ["*.yaml", "*.sha256", "schemas/*.json", "data/damit-20250610T000301Z/*.json", "data/damit-20250610T000301Z/*.jsonl", "data/damit-20250610T000301Z/SHA256SUMS"]

[tool.pytest.ini_options]
minversion = "8.2"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "--showlocals",
  "-ra",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "gpu: requires a CUDA-capable GPU and is excluded from CPU CI",
  "integration: exercises multiple V2 pipeline stages or external artifacts",
  "slow: takes more than ten seconds on the reference CPU",
]

[tool.coverage.run]
branch = true
source = ["lc_pipeline"]
parallel = true
relative_files = true

[tool.coverage.report]
# Fail coverage-enabled runs below the configured minimum.
fail_under = 80
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.paths]
source = [
  "lc_pipeline/",
  "*/site-packages/lc_pipeline/",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
