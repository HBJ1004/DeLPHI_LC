# Light Curve Pipeline Configuration

# General pipeline configuration
seed: 42
device: cuda  # Will be set to CPU if CUDA is not available

# Workflow steps to run
run_period_training: true
run_axis_training: true
run_hyperopt: true
run_fine_tuning: true
run_evaluation: true

# Data configuration
data:
  # Data sources
  use_synthetic_data: false
  use_damit_data: true
  max_damit_files: 10000  # Limit number of DAMIT files used
  synthetic_data_dir: lc_sample/
  damit_data_dir: DAMIT_csv/
  force_rebuild_cache: true
  
  # Dataset parameters
  max_sequence_length: 200
  train_val_ratio: 0.25
  val_ratio: 0.05
  
  # Phase-folding configuration
  num_axis_bins: 100
  smooth_axis_data: true
  
  # Augmentation
  use_augmentation: false
  augmentation_factors: [0.8, 1.2]
  noise_level: 0.01

# Period model configuration
period_model:
  # Model selection
  model_name: PeriodLSTMWithLSPrior  # Options: PeriodLSTMNet, PeriodTCNNet, PeriodTransformerNet, etc.
  input_dim: 17
  hidden_dim: 128
  num_layers: 3
  dropout: 0.2
  loss_function: "LogSpacePeriodMAELoss"
  
  # LS Prior settings
  use_ls_prior: true
  
  # Log-scale settings
  use_log_scale: true
  min_period: 2.0
  max_period: 100.0
  
  # Period scale factor (set to null for auto-calculation)
  period_scale_factor: 50.0
  
  # Training parameters
  batch_size: 64
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  patience: 10
  
  # Hyperparameter search
  optuna_trials: 20
  optuna_epochs: 10
  hidden_dim_range: [64, 256]
  num_layers_range: [2, 5]
  dropout_range: [0.1, 0.5]
  lr_range: [0.0001, 0.01]
  weight_decay_range: [0.00001, 0.001]

# Axis model configuration
axis_model:
  # Model selection
  model_name: AxisCNNNet  # Options: AxisCNNNet, PhaseAwareTransformer, etc.
  
  # Model parameters
  blocks: 3
  initial_channels: 32
  hidden_dim: 128
  kernel: 5
  dropout: 0.2
  use_norm: true
  
  # Training parameters
  batch_size: 64
  epochs: 60
  lr: 0.001
  weight_decay: 0.0001
  patience: 10
  
  # Curriculum learning parameters
  use_curriculum: true
  curriculum_epochs: [20, 40, 60]
  
  # Special flags
  use_true_periods: false  # Use ground truth period for training
  use_quaternions: true    # Use quaternion representation for rotation
  
  # Hyperparameter search
  optuna_trials: 15
  optuna_epochs: 15
  hidden_dim_range: [64, 128]
  blocks_range: [2, 5]
  initial_channels_range: [16, 64]
  kernel_range: [3, 7]
  dropout_range: [0.1, 0.5]
  lr_range: [0.0001, 0.01]
  weight_decay_range: [0.00001, 0.001]

# Path configuration
paths:
  base_dir: .
  models_dir: models
  results_dir: results
  figures_dir: figures
  logs_dir: logs

# Logging configuration
logging:
  log_level: DEBUG
  log_to_file: true
  log_to_console: true
  
  # Email notifications
  enable_email: true
  email_recipient: "hangbin9@naver.com"
  
  # Visualization
  save_plots: true
  interactive_plots: false

# Hyperopt configuration
hyperopt:
  run_period_hyperopt: true
  run_axis_hyperopt: true
  train_after_hyperopt: true
  # model_to_optimize: 'both'
  
  # Ensure period_model and axis_model sections have optuna_trials, optuna_epochs,
  # and all necessary *_range parameters for Optuna's trial.suggest_* calls.
  # Example for period_model:
  period_model:
    # ... other params ...
    optuna_trials: 20
    optuna_epochs: 10
    hidden_dim_range: [64, 256]
    num_layers_range: [2, 5]
    dropout_range: [0.1, 0.5]
    lr_range: [0.0001, 0.01]
    weight_decay_range: [0.00001, 0.001]
    # For PeriodLSTMWithLSPrior, if you want to optimize prior_weight:
    # prior_weight_range: [0.1, 0.9] # objective_period needs to suggest this
  
  axis_model:
    # ... other params ...
    optuna_trials: 15
    optuna_epochs: 15
    hidden_dim_range: [64, 128]
    # ... other ranges for blocks, initial_channels, kernel, dropout, lr, weight_decay ... 
    blocks_range: [2, 5]
    initial_channels_range: [16, 64]
    kernel_range: [3, 7]
    dropout_range: [0.1, 0.5]
    lr_range: [0.0001, 0.01]
    weight_decay_range: [0.00001, 0.001] 